test_envs:
  dep_root: ''
  deps: []

# ── 现场态 / 对外契约 / 备份（示例）────────────────────────────────────
# 见 docs/design/contract.md、docs/design/prj-backup-restore.md。
#
# 本示例里 `.env` 与 `web.conf` 都是 `gops sys localize` 的产出（**可重建**）；
# `configs/` 是**对外契约**——不可重建的公开现场事实（对外域名 / 端点）。
# （示例把契约内容随仓库走以便演示；真实部署里它是 site-owned、不在交付包内。）

# 不进交付包（localize 的产出）；旧名 `ignore`
pkg_exclude:
  - .env
  - web.conf

# 额外纳入（默认模式补“未被 git 跟踪”的生成物；pkg_exclude 优先）——本示例不启用
# pkg_include:
#   - artifacts/app.bin

# 升级 / 重建不覆盖、也不删
protect:
  - .env
  - web.conf

# 对外契约：**独立**声明，只由 `prj contract export/import` 处理；与 protect / backup / 打包**互不影响**
contract:
  - configs

# 备份选取：只有 `prj backup` 收的现场态（只表达“丢失的代价”，不触发删除）
backup:
  - .env

# 宿主 bind 挂载权限（`gops sys perms`）：缺省完全按 compose 派生。
# 以 root 运行的服务自动跳过（root 不受宿主文件模式限制）。
# 仅在下面三种情况才需要显式声明：
#   1) rootless / userns-remap（容器 uid ≠ 宿主 uid）→ container_uid/gid
#   2) 镜像默认 root、但入口脚本降权（如 postgres → 999 后才读 initdb.d）→ services
#   3) bind source 在系统根之外 → allow_external
#
# perms:
#   container_uid: 100999
#   container_gid: 100999
#   services:                 # 按 compose 服务名声明；只影响对齐，不改运行时
#     postgres:
#       uid: 999
#       gid: 999
#   allow_external:
#     - /srv/shared/packages
