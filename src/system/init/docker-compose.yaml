# 系统级 docker-compose 定义（由 `gops sys new` 生成，可按需修改）
#
# 约定：
#   - 用 Docker Compose 原生 ${VAR} 占位，运行时由系统根目录的 .env 提供值
#     （文件在 sys/ 下，但 compose 以系统根作为项目目录，所以 .env / 相对挂载都相对系统根）
#   - .env 由 `gops sys localize` 从 sys/setting/vars.yml 的 system 段生成
#   - 密钥（密码/token）用 ${SEC_xxx} 占位，运行时由 gops sys start 从 ~/.galaxy/sec_value.yml 注入，不落盘
services:
  app:
    image: ${SERVICE_IMAGE}
    ports:
      - "${SERVICE_PORT}:80"
    # 注意：固定端口映射 + 多副本会端口冲突（同一宿主端口只能绑一次）。
    # 如需 replicas>1，请去掉上面的 ports 固定映射，或改用端口区间（如 "8080-8083:80"）。
    deploy:
      replicas: ${REPLICAS}
